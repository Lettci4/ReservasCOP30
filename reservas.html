<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - COP 30</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-success fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">COP 30 Reservas</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Reservas</a></li>
          <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5 mt-5">
    <div class="container">
      <h2 class="text-center text-success mb-4">Faça sua Reserva</h2>
      <form id="reservaForm" class="mx-auto" style="max-width: 500px;">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome completo</label>
          <input type="text" id="nome" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="data" class="form-label">Data da reserva</label>
          <input type="date" id="data" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Confirmar Reserva</button>
      </form>
    </div>
  </section>

  <footer class="bg-success text-white text-center py-3">
    &copy; 2025 COP 30 Reservas
  </footer>

  <script>
    document.getElementById("reservaForm").addEventListener("submit", function(event) {
      event.preventDefault();
      window.location.href = "confirmacao.html";
    });
  </script>
  
</body>
</html>
