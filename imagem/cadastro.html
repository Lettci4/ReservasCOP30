<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sistema de cadastro</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 0;
      background: #f2f2f2;
    }
    header {
      background: #5fcc00;
      color: #ffffff;
      padding: 1px;
      text-align: center;
    }
    .container {
      max-width: 500px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #cccccc;
      border-radius: 5px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: #00cc0e;
      color: rgb(255, 255, 255);
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #39443f;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sistema de cadastro</h1>
  </header>

  <div class="container">
    <h2>Faça sua Reserva</h2>
    <form>
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" required />

      <label for="email">E-mail</label>
      <input type="email" id="email" required />

      <label for="data">Data da entrada</label>
      <input type="date" id="data" required />

      <label for="data">Data de saída</label>
      <input type="date" id="data" required />


      <label for="hora">Horário</label>
      <input type="time" id="hora" required />

      <label for="tipo">Tipo de Reserva</label>
      <select id="tipo" required>
        <option value="resort">Resort</option>
        <option value="pousada">Pousada</option>
        <option value="hotel">Hotel</option>
      </select>

      <button type="submit">Confirmar Reserva</button>
    </form>
  </div>
</body>
</html>
